name: SUA Lab offline QA

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/offline-qa.yml"
      - "scripts/**"
      - "src/**"
      - "configs/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight dependencies
        run: python -m pip install -r requirements.txt
      - name: Check deterministic harness
        run: python tests/test_smoke.py
      - name: Check V2 institutional protocol and selected-idea analysis
        run: python tests/test_stage1_v2.py
