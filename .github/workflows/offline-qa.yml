name: Offline checks

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/offline-qa.yml"
      - "scripts/**"
      - "src/**"
      - "configs/**"
      - "tests/**"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Deterministic pipeline
        run: python tests/test_smoke.py
      - name: Institutional protocol
        run: python tests/test_stage1_v2.py
      - name: Regression checks
        run: python tests/test_harness_quality.py
