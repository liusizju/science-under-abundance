name: Stage-1 quick open-weight pilot

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/stage1-quick-pilot.yml"

permissions:
  contents: read

jobs:
  benchmark:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: qwen25-1.5b
            hf: Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M
          - label: smollm2-1.7b
            hf: bartowski/SmolLM2-1.7B-Instruct-GGUF:Q4_K_M
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install llama.cpp
        shell: bash
        run: |
          curl -LsSf https://llama.app/install.sh | SKIP_CUDA=1 SKIP_ROCM=1 SKIP_VULKAN=1 sh
          ~/.llama-app/llama --version
      - name: Start model
        shell: bash
        run: |
          mkdir -p benchmark_logs
          nohup ~/.llama-app/llama serve -hf "${{ matrix.hf }}" --alias "${{ matrix.label }}" \
            --host 127.0.0.1 --port 8080 -c 4096 -np 1 \
            > "benchmark_logs/${{ matrix.label }}.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          cat "benchmark_logs/${{ matrix.label }}.log"; exit 1
      - name: Run quick 3-condition pilot
        env:
          SUA_BASE_URL: http://127.0.0.1:8080/v1
        run: |
          python scripts/run_stage1_benchmark.py \
            --model "${{ matrix.label }}" --model-label "${{ matrix.label }}" \
            --n-seeds 2 --n-agents 3 \
            --out "benchmark_runs/${{ matrix.label }}"
      - name: Freeze metadata
        shell: bash
        run: |
          {
            echo "workflow_sha=${GITHUB_SHA}"
            echo "hf_model=${{ matrix.hf }}"
            date -u +"utc_finished=%Y-%m-%dT%H:%M:%SZ"
            ~/.llama-app/llama --version 2>&1 | head -5
          } > "benchmark_runs/${{ matrix.label }}/runtime.txt"
          cp "benchmark_logs/${{ matrix.label }}.log" "benchmark_runs/${{ matrix.label }}/server.log"
      - uses: actions/upload-artifact@v4
        with:
          name: quick-${{ matrix.label }}
          path: benchmark_runs/${{ matrix.label }}
          retention-days: 90

  combine:
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: quick-*
          path: downloaded
      - name: Analyze
        run: |
          python scripts/analyze_stage1_benchmark.py \
            downloaded/quick-qwen25-1.5b/raw_traces.jsonl \
            downloaded/quick-smollm2-1.7b/raw_traces.jsonl \
            --out combined_benchmark
          cp downloaded/quick-qwen25-1.5b/manifest.json combined_benchmark/qwen_manifest.json
          cp downloaded/quick-smollm2-1.7b/manifest.json combined_benchmark/smol_manifest.json
          printf "workflow_sha=%s\n" "$GITHUB_SHA" > combined_benchmark/FROZEN_RUN.txt
          date -u +"utc_aggregated=%Y-%m-%dT%H:%M:%SZ" >> combined_benchmark/FROZEN_RUN.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stage1-quick-combined
          path: combined_benchmark
          retention-days: 90
