name: Stage-1 SmolLM2 retry

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/stage1-smollm2-retry.yml"

permissions:
  contents: read

jobs:
  smollm2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install llama.cpp CPU runtime
        shell: bash
        run: |
          set -euxo pipefail
          curl -LsSf https://llama.app/install.sh | SKIP_CUDA=1 SKIP_ROCM=1 SKIP_VULKAN=1 sh
          ~/.llama-app/llama --version
      - name: Start SmolLM2 server
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p benchmark_logs
          nohup ~/.llama-app/llama serve \
            -hf "bartowski/SmolLM2-1.7B-Instruct-GGUF:Q4_K_M" \
            --alias "smollm2-1.7b" \
            --host 127.0.0.1 --port 8080 -c 4096 -np 1 \
            > benchmark_logs/smollm2-1.7b-server.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          cat benchmark_logs/smollm2-1.7b-server.log
          exit 1
      - name: Run 3-condition pilot
        env:
          SUA_BASE_URL: http://127.0.0.1:8080/v1
        run: |
          python scripts/run_stage1_benchmark.py \
            --model "smollm2-1.7b" \
            --model-label "smollm2-1.7b" \
            --n-seeds 3 --n-agents 6 \
            --out benchmark_runs/smollm2-1.7b
      - name: Freeze runtime metadata
        shell: bash
        run: |
          {
            echo "workflow_sha=${GITHUB_SHA}"
            echo "hf_model=bartowski/SmolLM2-1.7B-Instruct-GGUF:Q4_K_M"
            date -u +"utc_finished=%Y-%m-%dT%H:%M:%SZ"
            ~/.llama-app/llama --version 2>&1 | head -5
          } > benchmark_runs/smollm2-1.7b/runtime.txt
          cp benchmark_logs/smollm2-1.7b-server.log benchmark_runs/smollm2-1.7b/server.log
      - uses: actions/upload-artifact@v4
        with:
          name: stage1-smollm2-1.7b-retry
          path: benchmark_runs/smollm2-1.7b
          retention-days: 90
